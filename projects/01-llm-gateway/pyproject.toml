[project]
name = "llm-gateway"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["boto3", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "moto"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]